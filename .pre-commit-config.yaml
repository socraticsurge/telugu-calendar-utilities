# Pre-commit hooks — opt-in for local devs. Install with:
#   pip install pre-commit && pre-commit install
#
# CI runs the same Ruff debt check. The remaining hooks are client-side
# guards for trivial issues before they hit a PR review.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'    # markdown line breaks
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: local
    hooks:
      # The baseline makes the existing debt explicit while rejecting any
      # increase. It avoids mass-formatting the frozen calculation core.
      - id: ruff-baseline
        name: ruff baseline (no new E/F/I debt)
        entry: python tools/check_ruff_baseline.py
        language: python
        additional_dependencies: [ruff==0.16.2]
        pass_filenames: false
