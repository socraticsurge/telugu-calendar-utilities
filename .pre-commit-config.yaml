# Pre-commit hooks — opt-in for local devs. Install with:
#   pip install pre-commit && pre-commit install
#
# CI does NOT run these (yet) — they're a client-side guard to catch
# trivial issues before they hit a PR review. Keep the hook set
# narrow so onboarding stays cheap.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
        exclude: '\.md$'    # markdown line breaks
      - id: end-of-file-fixer
      - id: check-yaml
        args: [--allow-multiple-documents]
      - id: check-json
      - id: check-toml
      - id: check-added-large-files
        args: [--maxkb=500]
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: [--fix=lf]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.0
    hooks:
      # E = pycodestyle errors, F = pyflakes, I = isort (import order).
      # Intentionally tight — broader rule sets will produce noise on
      # an existing codebase. Expand once the team agrees on style.
      - id: ruff
        args: [--fix, --select, 'E,F,I', --extend-ignore, 'E501']
