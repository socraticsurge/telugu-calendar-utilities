[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-panchangam"
version = "1.7.1"
description = "MCP server for Panchangam calculations — Tithi, Nakshatra, Yoga, Muhurtas for any city"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["panchangam", "vedic", "astrology", "mcp", "calendar"]
dependencies = [
    "mcp>=1.0",
    "pyswisseph>=2.10.3",
    "pytz>=2024.1",
    "geopy",
    "timezonefinder",
    "icalendar>=5.0.0",
]

[project.urls]
Homepage = "https://panchangam.astrochaganti.com"
Repository = "https://github.com/socraticsurge/telugu-calendar-utilities"
Issues = "https://github.com/socraticsurge/telugu-calendar-utilities/issues"
Changelog = "https://github.com/socraticsurge/telugu-calendar-utilities/releases"

[project.scripts]
mcp-server-panchangam = "telugu_panchangam.mcp.server:main"

[tool.setuptools.packages.find]
include = ["telugu_panchangam*"]
