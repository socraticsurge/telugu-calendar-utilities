[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-server-panchangam"
version = "1.12.16"
description = "MCP server for Panchangam calculations — Tithi, Nakshatra, Yoga, Muhurtas for any city"
readme = "README_PYPI.md"
requires-python = ">=3.10"
license = {text = "MIT"}
keywords = ["panchangam", "vedic", "astrology", "mcp", "calendar"]
dependencies = [
    "mcp>=1.0",
    "pyswisseph>=2.10.3",
    "pytz>=2024.1",
    "geopy",
    "timezonefinder",
    "icalendar>=5.0.0",
]

[project.optional-dependencies]
# pyproject.toml is the source of truth for what the package and its
# tests need. requirements.txt is a thin shim that does
# `pip install -e .[test]` so existing tooling keeps working.
test = [
    "pytest>=8.0.0",
]
# Browser-smoke deps. Heavy install (~100 MB chromium); kept separate
# so plain `pip install -e .[test]` stays light for local dev — the
# browser smoke tests use pytest.importorskip and auto-skip when
# Playwright isn't present.
browser-test = [
    "playwright>=1.40",
]
# LLM-generated Rasi Phalalu. Install with: pip install -e .[llm]
llm = [
    "requests>=2.28",
]

[project.urls]
Homepage = "https://panchangam.astrochaganti.com"
Repository = "https://github.com/socraticsurge/telugu-calendar-utilities"
Issues = "https://github.com/socraticsurge/telugu-calendar-utilities/issues"
Changelog = "https://github.com/socraticsurge/telugu-calendar-utilities/releases"

[project.scripts]
mcp-server-panchangam = "telugu_panchangam.mcp.server:main"

[tool.setuptools.packages.find]
include = ["telugu_panchangam*"]
