# Dependabot config — weekly bumps for pip + github-actions.
#
# pyproject.toml declares Python dependencies and uv.lock is the active
# CI/release resolution. Dependabot updates both through the pip ecosystem.
#
# All third-party Actions in .github/workflows/ are kept in lockstep
# (helps when we move to SHA-pinning — Dependabot understands SHAs
# and bumps them with the tag in the comment).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - pip
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps,ci)"
