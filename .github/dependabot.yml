# Dependabot config — weekly bumps for pip + github-actions.
#
# pyproject.toml dependencies are the source of truth for runtime
# packages; requirements.txt is what CI installs. Dependabot watches
# both because they're both `pip` ecosystem files.
#
# All third-party Actions in .github/workflows/ are kept in lockstep
# (helps when we move to SHA-pinning — Dependabot understands SHAs
# and bumps them with the tag in the comment).
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - pip
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Asia/Kolkata
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "chore(deps,ci)"
