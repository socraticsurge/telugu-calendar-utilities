name: Security

# Two scanners — both run on PR + push-to-master + weekly cron + on demand.
#
# CodeQL: catches Python correctness/security antipatterns at the source level.
# pip-audit: catches known CVEs in the dependency closure that CI actually
# installs (i.e. requirements.txt — the same closure that ships in the
# generate.yml / publish.yml workflows).
#
# Both are blocking on PRs. SECURITY.md promises a 72h ack — discovering
# CVEs at PR time is how that ack gets enforced.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC — weekly fresh scan
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write    # for CodeQL to upload SARIF
  actions: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@99df26d4f13ea111d4ec1a7dddef6063f76b97e9 # v4.37.0
        with:
          languages: python
          # security-and-quality is slightly wider than the default
          # security-extended; catches both vulns and quality issues
          # (dead code, exception-swallow, etc.) — fits a maintenance
          # project.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@8aad20d150bbac5944a9f9d289da16a4b0d87c1e # v4.36.2
        with:
          category: '/language:python'

  pip-audit:
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (strict — fail on any known CVE)
        # Audits requirements.lock (the resolved, pinned dependency closure
        # — mcp, pyswisseph, pytz, geopy, timezonefinder, icalendar, pytest,
        # all transitives) rather than requirements.txt. The lockfile does
        # not include our own package, so version-bump PRs don't spuriously
        # fail looking up the unreleased version on PyPI. --strict still
        # fails on any known CVE in the closure.
        run: pip-audit -r requirements.lock --strict
