name: Security

# Two scanners — both run on PR + push-to-master + weekly cron + on demand.
#
# CodeQL: catches Python correctness/security antipatterns at the source level.
# pip-audit: catches known CVEs in the dependency environment that CI actually
# installs from requirements.txt — the same input used by the generate.yml /
# publish.yml workflows.
#
# Both are blocking on PRs. SECURITY.md promises a 72h ack — discovering
# CVEs at PR time is how that ack gets enforced.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC — weekly fresh scan
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write    # for CodeQL to upload SARIF
  actions: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Initialize CodeQL
        uses: github/codeql-action/init@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          languages: python
          # security-and-quality is slightly wider than the default
          # security-extended; catches both vulns and quality issues
          # (dead code, exception-swallow, etc.) — fits a maintenance
          # project.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@7188fc363630916deb702c7fdcf4e481b751f97a # v4.37.1
        with:
          category: '/language:python'

  pip-audit:
    name: pip-audit (installed environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Remove the unpublished local distribution
        # requirements.txt installs this checkout editably so its dependencies
        # match CI. The local version is not yet on PyPI and therefore cannot
        # be queried by pip-audit; uninstalling it leaves its full dependency
        # closure installed for the strict environment audit below.
        run: pip uninstall --yes mcp-server-panchangam

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (strict — fail on any known CVE)
        # Audit the dependency environment installed above. --local keeps the
        # gate aligned with CI; --strict fails on collection errors as well as
        # known vulnerabilities.
        run: pip-audit --local --strict
