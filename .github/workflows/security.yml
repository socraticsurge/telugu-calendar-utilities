name: Security

# Two scanners — both run on PR + push-to-master + weekly cron + on demand.
#
# CodeQL: catches Python correctness/security antipatterns at the source level.
# pip-audit: catches known CVEs in the dependency environment that CI actually
# installs from requirements.txt — the same input used by the generate.yml /
# publish.yml workflows.
#
# Both are blocking on PRs. SECURITY.md promises a 72h ack — discovering
# CVEs at PR time is how that ack gets enforced.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC — weekly fresh scan
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write    # for CodeQL to upload SARIF
  actions: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          # security-and-quality is slightly wider than the default
          # security-extended; catches both vulns and quality issues
          # (dead code, exception-swallow, etc.) — fits a maintenance
          # project.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:python'

  pip-audit:
    # Keep this display name stable: branch protection requires this context.
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Install runtime deps
        run: pip install -r requirements.txt

      - name: Remove non-project distributions from the audit set
        # requirements.txt installs this checkout editably so its dependencies
        # match CI. The local version is not yet on PyPI and therefore cannot
        # be queried by pip-audit. setuptools is a runner/build bootstrap, not
        # a declared project dependency. Removing both leaves the full project
        # dependency closure installed for the strict environment audit below.
        run: pip uninstall --yes mcp-server-panchangam setuptools

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit (strict — fail on any known CVE)
        # Audit the dependency environment installed above. --local keeps the
        # gate aligned with CI; --strict fails on collection errors as well as
        # known vulnerabilities.
        run: pip-audit --local --strict
