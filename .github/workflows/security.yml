name: Security

# Two scanners — both run on PR + push-to-master + weekly cron + on demand.
#
# CodeQL: catches Python correctness/security antipatterns at the source level.
# pip-audit: catches known CVEs in the runtime dependency set resolved by the
# same uv.lock used by CI, generation and publishing workflows.
#
# Both are blocking on PRs. SECURITY.md promises a 72h ack — discovering
# CVEs at PR time is how that ack gets enforced.

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '0 9 * * 1'   # Mondays 09:00 UTC — weekly fresh scan
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  actions: read

jobs:
  codeql:
    name: CodeQL (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write    # upload CodeQL SARIF only from this job
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: python
          # security-and-quality is slightly wider than the default
          # security-extended; catches both vulns and quality issues
          # (dead code, exception-swallow, etc.) — fits a maintenance
          # project.
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:python'

  pip-audit:
    # Keep this legacy display name stable: branch protection requires it.
    name: pip-audit (requirements.txt)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Install locked runtime and audit dependencies
        run: uv sync --locked --only-group audit --no-install-project --no-build

      - name: Export the locked runtime dependency set
        run: uv export --quiet --locked --no-dev --no-emit-project --output-file .audit-requirements.txt

      - name: Run pip-audit (strict — fail on any known CVE)
        # Hash enforcement proves the audit input came from uv.lock; --strict
        # fails on collection errors as well as known vulnerabilities.
        run: uv run --no-sync --no-build pip-audit --strict --disable-pip --require-hashes -r .audit-requirements.txt
