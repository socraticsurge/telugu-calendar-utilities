name: Deploy Landing Page

on:
  push:
    branches: [master]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/og-image.png'
      - 'public/sitemap.xml'
      - 'public/robots.txt'
      - 'package.json'
      - 'package-lock.json'
      - 'vite.config.ts'
      - 'tsconfig.json'
  workflow_dispatch:

# Singleton across every workflow that publishes to gh-pages
# (deploy-landing, generate, gochara, lagna). They all push to the
# same branch — concurrent runs collide. cancel-in-progress: false
# means we queue instead of dropping work mid-deploy.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Node
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # keep_files preserves the feeds/ already on gh-pages.
      # Full regeneration stays with generate.yml.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          cname: panchangam.astrochaganti.com
          keep_files: true
