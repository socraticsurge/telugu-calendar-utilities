name: Deploy Landing Page

on:
  push:
    branches: [master]
    paths:
      - 'docs/index.html'
      - 'docs/og-image.png'
      - 'docs/muhurta-scorer.js'
      - 'docs/sitemap.xml'
      - 'docs/robots.txt'
  workflow_dispatch:

# Singleton across every workflow that publishes to gh-pages
# (deploy-landing, generate, gochara, lagna). They all push to the
# same branch — concurrent runs collide. cancel-in-progress: false
# means we queue instead of dropping work mid-deploy.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Stage landing page
        run: mkdir -p public && cp docs/index.html docs/og-image.png docs/muhurta-scorer.js docs/sitemap.xml docs/robots.txt public/

      # keep_files preserves the feeds/ already on gh-pages — only
      # index.html is replaced. Full regeneration stays with generate.yml.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          cname: panchangam.astrochaganti.com
          keep_files: true
