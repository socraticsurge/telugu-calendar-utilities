name: CI

on:
  pull_request:
  push:
    branches-ignore: [master, gh-pages]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (for browser smoke tests)
        # Local dev environments can skip this; tests/test_browser_smoke.py
        # uses pytest.importorskip to auto-skip when Playwright isn't
        # available. CI always installs so the smoke tests actually run.
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Set up Node (for JS scorer parity tests)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run JS scorer tests
        # Zero-dependency: tests/js/*.js use node:test + node:assert
        # built-ins, so no npm install step is needed. Loops so a new
        # test file added under tests/js/ is picked up automatically.
        run: |
          for f in tests/js/*.js; do
            node --test "$f"
          done
