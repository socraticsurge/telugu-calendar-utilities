name: CI

on:
  pull_request:
  push:
    branches-ignore: [master, gh-pages]

# Push validates a branch before it has a PR. After a PR opens, GitHub emits
# both push and pull_request events for the same commit; normalize both to the
# source branch so only one matrix completes. Job names stay unchanged for
# branch-protection compatibility.
concurrency:
  group: ci-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't kill the other versions if one fails — we want to see
      # exactly which Python version regresses.
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.10". This
        # matrix exercises everything we claim to support. Adjust
        # the floor here and in pyproject.toml together.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (for browser smoke tests)
        # Local dev environments can skip this; tests/test_browser_smoke.py
        # uses pytest.importorskip to auto-skip when Playwright isn't
        # available. CI always installs so the smoke tests actually run.
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Set up Node (for Vite build + Vitest)
        # Node 24 is current Active LTS (since Oct 2025, supported through
        # Oct 2026). Node 20 hit EOL in April 2026. Must run BEFORE pytest:
        # tests/test_browser_smoke.py builds the site (`npm run build`)
        # and exercises dist/ — the exact bytes the deploys publish.
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Run Vitest (TS scorer + component tests)
        # Covers src/scorer/__tests__/ — the TS mirror of the Python
        # muhurta behaviour. Any Python↔TS drift must fail HERE (the
        # regression class of the PR-63 tara_dosha parity bug).
        run: npm test
