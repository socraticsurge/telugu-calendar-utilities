name: CI

on:
  pull_request:
  push:
    branches-ignore: [master, gh-pages]

# Cancel superseded CI runs on the same ref. Master and gh-pages
# don't get CI runs (push is filtered above), so the ref here is
# always a feature branch or a PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't kill the other versions if one fails — we want to see
      # exactly which Python version regresses.
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.10". This
        # matrix exercises everything we claim to support. Adjust
        # the floor here and in pyproject.toml together.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (for browser smoke tests)
        # Local dev environments can skip this; tests/test_browser_smoke.py
        # uses pytest.importorskip to auto-skip when Playwright isn't
        # available. CI always installs so the smoke tests actually run.
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Set up Node (for JS scorer parity tests)
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Run JS scorer tests
        # Zero-dependency: tests/js/*.js use node:test + node:assert
        # built-ins, so no npm install step is needed. nullglob means
        # an empty tests/js/ directory exits cleanly instead of running
        # the literal pattern as a filename.
        run: |
          shopt -s nullglob
          files=(tests/js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS tests under tests/js/ — skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            node --test "$f"
          done
