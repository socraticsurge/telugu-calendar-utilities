name: CI

on:
  pull_request:
  push:
    branches-ignore: [master, gh-pages]

# Cancel superseded CI runs on the same ref. Master and gh-pages
# don't get CI runs (push is filtered above), so the ref here is
# always a feature branch or a PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      # Don't kill the other versions if one fails — we want to see
      # exactly which Python version regresses.
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.10". This
        # matrix exercises everything we claim to support. Adjust
        # the floor here and in pyproject.toml together.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright (for browser smoke tests)
        # Local dev environments can skip this; tests/test_browser_smoke.py
        # uses pytest.importorskip to auto-skip when Playwright isn't
        # available. CI always installs so the smoke tests actually run.
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Set up Node (for JS scorer parity tests)
        # Node 24 is current Active LTS (since Oct 2025, supported through
        # Oct 2026). Node 20 hit EOL in April 2026. The JS scorer tests
        # use only built-in node:test + node:assert (stable since Node 18)
        # so any modern Node works — pinning to 24 keeps us on Active LTS.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'

      - name: Run JS scorer tests
        # Zero-dependency: tests/js/*.js use node:test + node:assert
        # built-ins, so no npm install step is needed. tests/js/package.json
        # sets "type":"commonjs" so these files run as CJS even though the
        # root package.json sets "type":"module" for Vite.
        # nullglob means an empty tests/js/ directory exits cleanly.
        run: |
          shopt -s nullglob
          files=(tests/js/*.js)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No JS tests under tests/js/ — skipping."
            exit 0
          fi
          for f in "${files[@]}"; do
            node --test "$f"
          done
