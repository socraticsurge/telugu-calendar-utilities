name: CI

on:
  pull_request:
  push:
    branches-ignore: [gh-pages]

permissions:
  contents: read
  pull-requests: read

# Push validates a branch before it has a PR. Push and pull-request events use
# separate concurrency groups so neither can leave canceled checks on the
# other's commit. The scope job suppresses the push suite once that commit is
# associated with an open PR; the PR suite then owns the protected contexts.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  scope:
    name: CI scope
    runs-on: ubuntu-latest
    outputs:
      run-suite: ${{ steps.scope.outputs.run-suite }}
    steps:
      - id: scope
        name: Decide whether this event owns the suite
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" != "push" ]]; then
            echo "run-suite=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          open_pr_count="$(gh api \
            "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '[.[] | select(.state == "open")] | length')"
          if (( open_pr_count > 0 )); then
            echo "run-suite=false" >> "$GITHUB_OUTPUT"
          else
            echo "run-suite=true" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ github.event_name == 'push' && format('branch test ({0})', matrix.python-version) || format('test ({0})', matrix.python-version) }}
    needs: scope
    if: needs.scope.outputs.run-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      # Don't kill the other versions if one fails — we want to see
      # exactly which Python version regresses.
      fail-fast: false
      matrix:
        # pyproject.toml declares requires-python = ">=3.10". This
        # matrix exercises everything we claim to support. Adjust
        # the floor here and in pyproject.toml together.
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Install locked Python dependencies
        # PySwissEph is the sole hash-locked source-build exception; the helper
        # requires wheels for every other package and locks its build tooling.
        run: python tools/install_locked_dependencies.py --extra test

      - name: Enforce static-analysis debt baselines
        run: |
          uv run --no-sync --no-build python tools/check_ruff_baseline.py
          uv run --no-sync --no-build python tools/check_complexity_baseline.py

      - name: Run tests
        run: uv run --no-sync --no-build python -m pytest tests/ -v --ignore=tests/test_browser_smoke.py

  frontend-and-browser:
    name: ${{ github.event_name == 'push' && 'branch frontend-and-browser' || 'frontend-and-browser' }}
    needs: scope
    if: needs.scope.outputs.run-suite == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python 3.11
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Install locked Python dependencies
        run: python tools/install_locked_dependencies.py --extra test --extra browser-test

      - name: Install Playwright
        run: uv run --no-sync --no-build playwright install --with-deps chromium

      - name: Set up Node 24
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install npm dependencies
        run: npm ci --ignore-scripts

      - name: Run browser smoke tests
        # The session-scoped fixture runs the production build once, then all
        # browser cases exercise the exact dist/ bytes deployed to Pages.
        run: uv run --no-sync --no-build python -m pytest tests/test_browser_smoke.py -v

      - name: Lint TypeScript
        run: npm run lint

      - name: Run Vitest with coverage (TS scorer + component tests)
        # Covers src/scorer/__tests__/ — the TS mirror of the Python
        # muhurta behaviour. Any Python↔TS drift must fail HERE (the
        # regression class of the PR-63 tara_dosha parity bug).
        run: npm run test:coverage
