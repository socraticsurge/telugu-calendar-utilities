name: Generate Lagna Data

on:
  schedule:
    - cron: '45 2 1 * *'   # 1st of every month, just after gochara.yml
  workflow_dispatch:

# Singleton across every workflow that publishes to gh-pages.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  lagna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -v

      - name: Build lagna feeds
        run: python -m scripts.build_lagna_json

      # keep_files preserves feeds/, index.html and gochara.json on
      # gh-pages — we only add/replace the per-city *-lagna.json files.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          cname: panchangam.astrochaganti.com
