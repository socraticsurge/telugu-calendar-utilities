name: Generate Gochara Data

on:
  schedule:
    - cron: '30 2 1 * *'   # 1st of every month, after feed generation
  workflow_dispatch:

# Singleton across every workflow that publishes to gh-pages.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  gochara:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.8'
          enable-cache: true

      - name: Install locked dependencies
        run: python tools/install_locked_dependencies.py --extra test

      - name: Run tests
        run: uv run --no-sync --no-build python -m pytest tests/ -v

      - name: Build gochara.json
        run: uv run --no-sync --no-build python -m scripts.build_gochara_json

      # keep_files preserves feeds/ and index.html on gh-pages — only
      # gochara.json is added/replaced. Fully independent of generate.yml.
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          cname: panchangam.astrochaganti.com
