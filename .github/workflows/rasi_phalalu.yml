name: Generate Rasi Phalalu

on:
  schedule:
    - cron: '30 1 * * *'  # 01:30 UTC daily (~07:00 IST, after sunrise)
  workflow_dispatch:       # allow manual trigger from Actions tab

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .[llm]

      - name: Generate Rasi Phalalu
        env:
          rasiphalalu: ${{ secrets.rasiphalalu }}
        run: python scripts/generate_llm_phalalu.py

      - name: Commit generated file
        run: |
          git config user.name "Socraticsurge"
          git config user.email "cvk.atreya@gmail.com"
          git add data/llm_phalalu/
          git diff --cached --quiet || git commit -m "chore: rasi phalalu $(date -u +%Y-%m-%d)"
          git push
