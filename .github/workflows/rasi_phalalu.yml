name: Generate Rasi Phalalu

on:
  schedule:
    - cron: '30 19 * * *'  # 19:30 UTC daily (01:00 IST next day)
  workflow_dispatch:       # allow manual trigger from Actions tab

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -e .[llm]

      - name: Generate Rasi Phalalu
        env:
          rasiphalalu: ${{ secrets.rasiphalalu }}
          PHALALU_OUT: ./public/rasi_phalalu
        run: python scripts/generate_llm_phalalu.py

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
          publish_branch: gh-pages
          keep_files: true
          force_orphan: true
          cname: panchangam.astrochaganti.com
