name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

# Per-tag singleton. A repushed identical tag (rare) won't kill an
# in-flight publish, and back-to-back distinct tags queue cleanly.
concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write       # OIDC for trusted publishing to PyPI
  contents: write       # softprops/action-gh-release writes the Release

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: '0.11.8'
          enable-cache: true

      # Fail-fast gates BEFORE we spend time installing deps. Both run
      # in <10s and catch the two release-procedure mistakes that have
      # historically been silent: tagging a version that doesn't match
      # the manifests, and tagging without promoting [Unreleased].
      - name: Verify version sync (pyproject ↔ server.json ↔ tag)
        run: |
          python <<'PY'
          import json, os, re, sys, tomllib
          tag = os.environ['GITHUB_REF_NAME']
          if not re.fullmatch(r'v\d+\.\d+\.\d+', tag):
              sys.exit(f'ERROR: unexpected tag shape {tag!r}. Expected vMAJOR.MINOR.PATCH.')
          tag_version = tag.lstrip('v')
          py_version = tomllib.load(open('pyproject.toml', 'rb'))['project']['version']
          sj = json.loads(open('server.json').read())
          sj_top, sj_pkg = sj['version'], sj['packages'][0]['version']
          mismatches = []
          if py_version != tag_version:
              mismatches.append(f'pyproject.toml ({py_version!r}) != tag ({tag_version!r})')
          if sj_top != tag_version:
              mismatches.append(f'server.json.version ({sj_top!r}) != tag ({tag_version!r})')
          if sj_pkg != tag_version:
              mismatches.append(f'server.json.packages[0].version ({sj_pkg!r}) != tag ({tag_version!r})')
          if mismatches:
              print('ERROR: version mismatch — bump all manifests together before tagging:')
              for m in mismatches:
                  print(f'  - {m}')
              sys.exit(1)
          print(f'OK: all four version strings agree on {tag_version!r}.')
          PY

      - name: Extract CHANGELOG section + gate on presence
        run: |
          python <<'PY'
          import os, re, sys
          tag = os.environ['GITHUB_REF_NAME']
          version = tag.lstrip('v')
          body = open('CHANGELOG.md').read()
          # Match `## [<version>] — <date>` (or just `## [<version>]`)
          # up to the next `## [` heading or end-of-file.
          pat = re.compile(
              rf'^## \[{re.escape(version)}\][^\n]*\n(.*?)(?=^## \[|\Z)',
              re.MULTILINE | re.DOTALL,
          )
          m = pat.search(body)
          if not m:
              sys.exit(
                  f'ERROR: CHANGELOG.md has no `## [{version}]` section. '
                  f'Promote `## [Unreleased]` -> `## [{version}]` before tagging.'
              )
          section = m.group(1).strip()
          if not section:
              sys.exit(f'ERROR: `## [{version}]` section is empty. Add release notes before tagging.')
          with open('.release_notes.md', 'w') as f:
              f.write(section + '\n')
          print(f'Extracted release notes for {version!r}:')
          print('---')
          print(section if len(section) < 600 else section[:600] + '\n... (truncated in log)')
          print('---')
          PY

      - name: Install runtime + test deps
        run: python tools/install_locked_dependencies.py --extra test --group build

      - name: Run tests
        run: uv run --no-sync python -m pytest tests/ -q

      - name: Build package
        run: uv run --no-sync python -m build --no-isolation

      - name: Verify release artifacts
        run: uv run --no-sync python tools/verify_release_artifacts.py dist

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          name: ${{ github.ref_name }}
          body_path: .release_notes.md
          files: dist/*
          draft: false
          prerelease: false
