name: Publish to PyPI

on:
  push:
    tags:
      - 'v*.*.*'

# Per-tag singleton. A repushed identical tag (rare) won't kill an
# in-flight publish, and back-to-back tags queue cleanly.
concurrency:
  group: pypi-publish-${{ github.ref }}
  cancel-in-progress: false

permissions:
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install runtime + test deps
        run: pip install -r requirements.txt

      - name: Run tests
        run: python -m pytest tests/ -q

      - name: Install build tools
        run: pip install build

      - name: Build package
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
